
[YAML]

# 创建台服代理策略组
+proxy-groups:
  - name: LOL-TW
    type: select
    include-all: true
    proxies:
      - DIRECT
    disable-udp: false

# 英雄联盟国际服规则
+rules:
  # 国服直连
  - DOMAIN-SUFFIX,lol.qq.com,DIRECT
  - DOMAIN-SUFFIX,lgame.qq.com,DIRECT
  - DOMAIN-SUFFIX,leagueoflegends.cn,DIRECT

  # 国际服代理
  - DOMAIN-SUFFIX,leagueoflegends.com,LOL-TW
  - DOMAIN-SUFFIX,leagueoflegends.net,LOL-TW
  - DOMAIN-SUFFIX,riotgames.com,LOL-TW
  - DOMAIN-SUFFIX,riotgames.net,LOL-TW
  - DOMAIN-SUFFIX,riotcdn.net,LOL-TW
  - DOMAIN-SUFFIX,pvp.net,LOL-TW
  - DOMAIN-SUFFIX,lolstatic.com,LOL-TW
  - DOMAIN-SUFFIX,rstatic.net,LOL-TW
  - DOMAIN-SUFFIX,lolusercontent.com,LOL-TW
