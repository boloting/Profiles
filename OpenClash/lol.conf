
[YAML]

+proxy-groups:
  - name: LOL-TW
    type: select
    include-all: true
    proxies:
      - DIRECT
    disable-udp: false

+rule-providers:
  LOL-TW-Rules:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/boloting/Profiles/master/OpenClash/LOL-TW.yaml
    path: ./rule_provider/LOL-TW.yaml
    interval: 86400

+rules:
  - RULE-SET,LOL-TW-Rules,LOL-TW
